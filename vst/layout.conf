[tab MANUAL]
art file=skin/looks/_bg_print.svg
frame x=14 y=100 w=1252 h=604 title="MANUAL"
enum_h cx=640 cy=166 label="" key=manual_page sw=190 sh=56 rows=1
text cx=60 cy=240 label="POTENTIALPATINA: RETRO COLOUR" size=1.9 weight=700 align=left color=1b1a18 when=manual_page:0
text cx=60 cy=280 label="Instant character for any track: vinyl crackle, tape hiss and wobble, warm drive, bit-crushing, tone and a small" size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:0
text cx=60 cy=312 label="room, all set with one big MAGNITUDE knob." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:0
text cx=62 cy=360 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:0
text cx=84 cy=360 label="Add it as an insert effect on a track, program, pad or bus. It is not in the instrument list." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:0
text cx=62 cy=392 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:0
text cx=84 cy=392 label="Tap an ERA, then turn AGE to set how worn it sounds." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:0
text cx=62 cy=424 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:0
text cx=84 cy=424 label="MAGNITUDE fades the whole effect evenly. AGE brings the sections in one by one." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:0
text cx=62 cy=456 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:0
text cx=84 cy=456 label="Each section has its own ON switch." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:0
text cx=60 cy=504 label="The full PotentialSuite manual: github.com/PotentialBreakfast/potential-plugins" size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:0
text cx=60 cy=240 label="CONTROLS" size=1.9 weight=700 align=left color=1b1a18 when=manual_page:1
text cx=62 cy=280 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:1
text cx=84 cy=280 label="MAGNITUDE: fades the whole effect in and out. MIX: blend with the dry sound. OUTPUT: the level." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:1
text cx=62 cy=312 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:1
text cx=84 cy=312 label="ERA: one tap sets all six sections for a sound of its time." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:1
text cx=62 cy=344 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:1
text cx=84 cy=344 label="AGE: clean to fully worn in one move. 50 % is the sound as set. Tone comes in first, then drive, noise," size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:1
text cx=84 cy=376 label="wobble, and digital and space last." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:1
text cx=62 cy=408 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:1
text cx=84 cy=408 label="NOISE: vinyl crackle, tape hiss or mains hum. DUCK turns it down while the music plays, so it comes up in the" size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:1
text cx=84 cy=440 label="gaps." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:1
text cx=62 cy=472 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:1
text cx=84 cy=472 label="WOBBLE: tape wow and flutter (pitch drift)." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:1
text cx=62 cy=504 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:1
text cx=84 cy=504 label="DRIVE: tape, tube or cassette saturation, level-matched so it does not just get louder." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:1
text cx=62 cy=536 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:1
text cx=84 cy=536 label="DIGITAL: bit depth and sample-rate reduction, for the old-sampler crunch." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:1
text cx=62 cy=568 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:1
text cx=84 cy=568 label="TONE: one dark to bright tilt knob. SPACE: a small room." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:1
text cx=62 cy=600 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:1
text cx=84 cy=600 label="ROLL: switches on a random set of sections with random settings. MILD, MEDIUM or WILD sets how far it goes." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:1
text cx=60 cy=240 label="ERAS AND PRESETS" size=1.9 weight=700 align=left color=1b1a18 when=manual_page:2
text cx=62 cy=280 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:2
text cx=84 cy=280 label="ERA (on the page): Patina, '50s 78, '60s 45, '70s Tape, '80s Sampler, '90s Cassette, AM Radio and VHS." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:2
text cx=62 cy=312 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:2
text cx=84 cy=312 label="MPC's PRESET menu: Patina, Dusty Vinyl, Worn Tape, Cassette Demo, 12-bit Sampler, Crunchy 8-bit, Old Radio," size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:2
text cx=84 cy=344 label="Basement Room and Clean, then the eras, then the four chain presets." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:2
text cx=62 cy=376 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:2
text cx=84 cy=376 label="The presets are set fairly subtle. Turn MAGNITUDE or the section knobs up for more." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:2
text cx=62 cy=408 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:2
text cx=84 cy=408 label="Chain presets: Dusty Loop, 90s Stab, Break Bus and Dub Drums. See the CHAINS page." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:2
text cx=60 cy=240 label="FX CHAINS" size=1.9 weight=700 align=left color=1b1a18 when=manual_page:3
text cx=60 cy=280 label="Put the plugins on a track's inserts in the order shown, then pick the same preset name in each one." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:3
text cx=62 cy=328 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:3
text cx=84 cy=328 label="DUSTY LOOP (soul, jazz and library loops): Bleed > PATINA > Grit. Patina is on '60s 45." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:3
text cx=62 cy=360 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:3
text cx=84 cy=360 label="90s STAB (chopped horns, keys and vocal stabs): Grit > Punch > Bleed > PATINA. Patina is on '90s Cassette." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:3
text cx=62 cy=392 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:3
text cx=84 cy=392 label="BREAK BUS (a boom-bap drum bus): Punch > Grit > Bleed > PATINA. Patina is on '70s Tape." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:3
text cx=62 cy=424 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:3
text cx=84 cy=424 label="DUB DRUMS (lo-fi dub drums): PATINA > Punch > Bleed > Grit. Patina is on '80s Sampler." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:3
text cx=60 cy=472 label="Here, in Grit and in Bleed the name is in the MPC's PRESET menu. In Punch it is on the PRESETS buttons." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:3
text cx=60 cy=520 label="Rules of thumb: Punch early, Bleed before Patina so the bleed is aged with the sound, echo and chop last, one" size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:3
text cx=60 cy=552 label="noise source per chain, and match levels with OUTPUT before you decide." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:3
text cx=60 cy=240 label="USER PRESETS" size=1.9 weight=700 align=left color=1b1a18 when=manual_page:4
text cx=62 cy=280 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:4
text cx=84 cy=280 label="To save: open the USER page, tap SAVE, then tap a slot. The slot now reads USER and its number." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:4
text cx=62 cy=312 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:4
text cx=84 cy=312 label="To load: tap a slot. The slot you loaded last is lit." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:4
text cx=62 cy=344 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:4
text cx=84 cy=344 label="Saving to a slot that is already filled replaces it straight away." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:4
text cx=62 cy=376 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:4
text cx=84 cy=376 label="The 8 slots are kept on the drive the plugin is on, in a folder called PotentialSuite Presets. Every project" size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:4
text cx=84 cy=408 label="and every copy of the plugin sees them, and updating the plugin keeps them." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:4
text cx=62 cy=440 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:4
text cx=84 cy=440 label="A chain of your own: save each plugin's part to the same slot number, for example USER 3 in Patina, Grit and" size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:4
text cx=84 cy=472 label="Bleed. Later, tap USER 3 in each." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:4
text cx=62 cy=504 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:4
text cx=84 cy=504 label="A slot keeps the knobs and switches. It does not keep the ROLL setting or the look." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:4
text cx=60 cy=240 label="GOOD TO KNOW" size=1.9 weight=700 align=left color=1b1a18 when=manual_page:5
text cx=62 cy=280 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:5
text cx=84 cy=280 label="Q-Links: MAGNITUDE, AGE, MIX, OUTPUT, TONE, NOISE, WOBBLE and DRIVE, then the section settings on the next" size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:5
text cx=84 cy=312 label="bank." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:5
text cx=62 cy=344 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:5
text cx=84 cy=344 label="Every setting is saved with your project." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:5
text cx=62 cy=376 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:5
text cx=84 cy=376 label="Looks: Print Plate, Night Rack or Colour Block, on the SETTINGS page. A new look shows the next time the" size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:5
text cx=84 cy=408 label="plugin loads." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:5
text cx=62 cy=440 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:5
text cx=84 cy=440 label="About 7 ms of delay while it is switched on, because of how the wobble works. It can be heard on tight" size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:5
text cx=84 cy=472 label="layered drums." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:5
text cx=62 cy=504 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:5
text cx=84 cy=504 label="Several copies at once, especially with SPACE on, may be a lot for an older MPC." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:5
text cx=62 cy=536 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:5
text cx=84 cy=536 label="Stereo in, stereo out, at 44.1 kHz." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:5
text cx=60 cy=584 label="Ideas, bugs and criticism are all welcome: github.com/PotentialBreakfast/mpc-vst-potentialpatina" size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:5
qlinks "MANUAL" = -
